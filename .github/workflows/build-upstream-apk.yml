name: Build Upstream Android APK

on:
  push:
    branches:
      - ci/upstream-apk-20260914
    paths:
      - '.github/workflows/build-upstream-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact upstream source snapshot
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies exactly from lockfile
        run: npm ci

      - name: Generate Android native project in CI workspace only
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DuDia-upstream-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuDia-Upstream-APK
          path: dist/DuDia-upstream-debug.apk
          if-no-files-found: error
          retention-days: 14
